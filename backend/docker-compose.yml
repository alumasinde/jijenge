services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jijenge}
      MYSQL_USER: ${MYSQL_USER:-jijenge_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --skip-name-resolve
    volumes:
      - jijenge_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [jijenge]

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DB_DRIVER: ${DB_DRIVER:-mysql}
      # multiStatements=true is required ONLY here: migration files contain
      # more than one SQL statement per file (e.g. multiple CREATE TABLE /
      # CREATE TRIGGER statements), and cmd/migrate executes each file's
      # contents as a single Exec call. The API's own DSN below deliberately
      # does NOT set multiStatements=true, since the running application
      # never needs to send stacked statements and there is no reason to
      # widen its attack surface.
      DB_DSN: ${MYSQL_USER:-jijenge_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/${MYSQL_DATABASE:-jijenge}?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci&multiStatements=true
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    depends_on:
      mysql:
        condition: service_healthy
    command: ["-command", "up"]
    networks: [jijenge]

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    environment:
      APP_NAME: ${APP_NAME:-Jijenge}
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8080}
      APP_READ_TIMEOUT: ${APP_READ_TIMEOUT:-10s}
      APP_WRITE_TIMEOUT: ${APP_WRITE_TIMEOUT:-15s}
      APP_IDLE_TIMEOUT: ${APP_IDLE_TIMEOUT:-60s}
      APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT:-15s}
      APP_MAX_BODY_BYTES: ${APP_MAX_BODY_BYTES:-1048576}
      APP_RATE_LIMIT_REQUESTS: ${APP_RATE_LIMIT_REQUESTS:-120}
      APP_RATE_LIMIT_WINDOW: ${APP_RATE_LIMIT_WINDOW:-1m}
      APP_AUTH_RATE_LIMIT_REQUESTS: ${APP_AUTH_RATE_LIMIT_REQUESTS:-10}
      APP_AUTH_RATE_LIMIT_WINDOW: ${APP_AUTH_RATE_LIMIT_WINDOW:-1m}
      PAYMENT_PROVIDER_NAME: ${PAYMENT_PROVIDER_NAME:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_CLEARING_ACCOUNT_ID: ${PAYMENT_CLEARING_ACCOUNT_ID:-0}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
      DB_DRIVER: ${DB_DRIVER:-mysql}
      DB_DSN: ${MYSQL_USER:-jijenge_app}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@tcp(mysql:3306)/${MYSQL_DATABASE:-jijenge}?parseTime=true&charset=utf8mb4&collation=utf8mb4_0900_ai_ci
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8080"
    networks: [jijenge]

networks:
  jijenge:
    driver: bridge

volumes:
  jijenge_mysql_data:
    name: jijenge_mysql_data
