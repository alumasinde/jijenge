name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Test and security audit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: services_platform
          MYSQL_USER: services_app
          MYSQL_PASSWORD: services_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          APP_ENV: test
          APP_DEBUG: "false"
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: services_platform
          MYSQL_USER: services_app
          MYSQL_PASSWORD: services_password
          JWT_SECRET: ci-test-secret-that-is-long-enough-for-the-test-suite-123456
          CORS_ORIGINS: http://localhost:3000
          RATE_LIMIT_ENABLED: "false"
        run: python -m pytest -v

      - name: Security audit
        run: python tools/security_audit.py

      - name: Validate migrations
        run: python tools/validate_migrations.py
